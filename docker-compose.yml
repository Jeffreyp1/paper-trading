# Single-network compose for the whole paper-trading stack.
# Bring up: docker compose up -d --build
# Tear down (keep data): docker compose down
# Tear down (drop volumes): docker compose down -v

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    # synchronous_commit=off: COMMIT returns before WAL fsync (background ~200ms).
    # Atomicity/Consistency/Isolation unchanged; only relaxes durability of the last
    # ~200ms of commits on power loss. Acceptable for paper trading; roughly 2x
    # bulk-write throughput.
    command: ["postgres", "-c", "synchronous_commit=off"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"  # host:container — 5433 on host to avoid clash with host postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paper]

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"  # host:container — 6380 on host to avoid clash with host redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [paper]

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [paper]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 20000000
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 20000000
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [paper]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "3000:3000"  # HTTP API
      - "8080:8080"  # WebSocket (wsServer.js)
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    networks: [paper]

  trading-service:
    build: ./trading-service
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks: [paper]

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka:    { condition: service_healthy }
    ports:
      - "8090:8090"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: ${KAFKA_ENABLED:-true}
      KAFKA_TOPIC_SIGNALS: ai_signals
      KAFKA_TOPIC_AUDIT: ai_audit
      KAFKA_TOPIC_TICKS_IN: trade_events
      NODE_TRADE_URL: ${NODE_TRADE_URL:-http://app:3000/api/v1/trading/trade}
      MODEL_ARTIFACTS_DIR: /app/models_artifacts
      AUTO_APPLY_MIGRATIONS: "true"
    volumes:
      - ai_models:/app/models_artifacts
    networks: [paper]

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - app
      - ai-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      # Server-side base URLs (in-cluster hostnames)
      NODE_API: http://app:3000
      GO_API:   http://trading-service:8081
      # Browser-side URLs (must use host-published ports)
      NEXT_PUBLIC_AI_API: ${NEXT_PUBLIC_AI_API:-http://localhost:8090}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    networks: [paper]

volumes:
  pgdata:
  redisdata:
  ai_models:

networks:
  paper:
    driver: bridge
